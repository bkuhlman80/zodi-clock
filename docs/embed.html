<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Z0DI Clock — Embed</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script defer src="https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.min.js"></script>
  <script type="module" src="./js/component.js?v=20250907-5"></script>
  <style>
    html,body{margin:0;background:#0f1218;color:#e6e7eb;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .controls{display:flex;gap:.5rem;align-items:center;margin:12px 0}
    .controls button{font:600 14px system-ui;padding:10px 14px;border-radius:10px;border:1px solid #444}
    .controls input{font:500 14px system-ui;padding:8px 10px;border-radius:10px;border:1px solid #444;min-width:280px}
    @media (min-width:768px){
      .controls button{font-size:16px;padding:12px 16px}
      .controls input{font-size:16px;padding:10px 12px;min-width:360px}
    }
  </style>
</head>
<body>
  <div id="controls" class="controls">
    <button id="btn-anim">Animated</button>
    <button id="btn-frozen">Frozen</button>
    <input id="dt-input" type="datetime-local" step="1">
  </div>

  <zodi-clock style="display:block;width:100%;max-width:2000px;"></zodi-clock>

  <script>
    const p = new URLSearchParams(location.search);
    const initialMode = p.get("mode") || "frozen";
    const dtParam     = p.get("dt");
    const controls    = p.get("controls") ?? "0";
    const labels      = p.get("labels")   ?? "1";

    customElements.whenDefined("zodi-clock").then(() => {
      const el = document.querySelector("zodi-clock");
      el.setAttribute("embed", "1");
      el.setAttribute("controls", controls);
      el.setAttribute("labels", labels);
      el.setAttribute("initial-mode", initialMode);
      if (dtParam) el.setAttribute("initial-dt", dtParam);
    });
  </script>
</body>
</html>
