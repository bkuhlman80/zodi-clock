<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Z0DI Clock — Embed</title>

  <!-- OG/Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Z0DI Clock — Embed">
  <meta property="og:description" content="Animated wheel of the year + tropical zodiac clock + eclipse tracker.">
  <meta property="og:url" content="https://bkuhlman80.github.io/zodi-clock/embed.html">
  <meta property="og:image" content="https://bkuhlman80.github.io/zodi-clock/preview.png?v=4">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Z0DI Clock — Embed">
  <meta name="twitter:description" content="Animated wheel of the year + tropical zodiac clock + eclipse tracker.">
  <meta name="twitter:image" content="https://bkuhlman80.github.io/zodi-clock/preview.png?v=4">

  <!-- Icons and CSS -->
  <link rel="icon" href="/zodi-clock/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/zodi-clock/apple-touch-icon.png">
  <link rel="stylesheet" href="/zodi-clock/style.css?v=1">

  <!-- Scripts -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script defer src="https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.min.js"></script>
  <script type="module" src="/zodi-clock/js/component.js?v=20250907-6"></script>
  <script type="module" src="/zodi-clock/js/date-overlay.js"></script>

  <style>
    html,body{margin:0;background:#0f1218;color:#e6e7eb;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .controls{display:flex;gap:.5rem;align-items:center;margin:12px 0}
    .controls button{font:600 14px system-ui;padding:10px 14px;border-radius:10px;border:1px solid #444}
    .controls input{font:500 14px system-ui;padding:8px 10px;border-radius:10px;border:1px solid #444;min-width:280px}
    @media (min-width:768px){
      .controls button{font-size:16px;padding:12px 16px}
      .controls input{font-size:16px;padding:10px 12px;min-width:360px}
    }
  </style>
</head>
<body>
  <div id="controls" class="controls">
    <button id="btn-anim">Animated</button>
    <button id="btn-frozen">Frozen</button>

    <div class="input-wrap">
      <input id="dt-input" type="datetime-local" step="3600" aria-describedby="dt-display">
      <span id="dt-display" aria-live="polite" aria-hidden="true"></span>
    </div>
  </div>

  <zodi-clock style="display:block;width:100%;max-width:2000px;"></zodi-clock>

  <script>
    const p = new URLSearchParams(location.search);
    customElements.whenDefined("zodi-clock").then(() => {
      const el = document.querySelector("zodi-clock");
      el.setAttribute("embed","1");
      el.setAttribute("controls", p.get("controls") ?? "0");
      el.setAttribute("labels",   p.get("labels")   ?? "1");
      el.setAttribute("initial-mode", p.get("mode") || "frozen");
      if (p.get("dt")) el.setAttribute("initial-dt", p.get("dt"));
    });
  </script>
</body>

</html>
