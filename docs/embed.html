<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Description -->
  <meta name="description" content="Animated wheel of the year + tropical zodiac clock + eclipse tracker.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Z0DI Clock — Embed">
  <meta property="og:description" content="Animated wheel of the year + tropical zodiac clock + eclipse tracker.">
  <meta property="og:url" content="https://bkuhlman80.github.io/zodi-clock/embed.html">
  <meta property="og:image" content="https://bkuhlman80.github.io/zodi-clock/preview.png?v=4">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Z0DI Clock — Embed">
  <meta name="twitter:description" content="Animated wheel of the year + tropical zodiac clock + eclipse tracker.">
  <meta name="twitter:image" content="https://bkuhlman80.github.io/zodi-clock/preview.png?v=4">

  <!-- Favicon (absolute URLs for scrapers) -->
  <link rel="icon" href="https://bkuhlman80.github.io/zodi-clock/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="https://bkuhlman80.github.io/zodi-clock/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/style.css?v=2">

  <title>Z0DI Clock — Embed</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script defer src="https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.min.js"></script>
  <script type="module" src="./js/component.js?v=20250907-6"></script>
</head>
<body>
  <div id="controls" class="controls">
    <button id="btn-anim">Animated</button>
    <button id="btn-frozen">Frozen</button>
    <input id="dt-input" type="datetime-local" step="1">
  </div>

  <zodi-clock class="zodi-container zodi-container--wide"></zodi-clock>

  <script>
    const p = new URLSearchParams(location.search);
    const initialMode = p.get("mode") || "frozen";
    const dtParam     = p.get("dt");
    const controls    = p.get("controls") ?? "0";
    const labels      = p.get("labels")   ?? "1";

    customElements.whenDefined("zodi-clock").then(() => {
      const el = document.querySelector("zodi-clock");
      el.setAttribute("embed", "1");
      el.setAttribute("controls", controls);
      el.setAttribute("labels", labels);
      el.setAttribute("initial-mode", initialMode);
      if (dtParam) el.setAttribute("initial-dt", dtParam);
    });
  </script>
</body>
</html>
